<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LMS Imports Supabase System</title>
    <link rel="stylesheet" href="./styles.css?v=20260813-work-order-part-columns-1">
  </head>
  <body>
    <aside class="side">
      <div class="brand">LMS Imports<span>Inventory, fleet, repair, rental, accounting</span></div>
      <nav id="nav"></nav>
      <div class="session" id="sessionBox"></div>
    </aside>
    <main class="main">
      <header class="top">
        <div>
          <h1 id="viewTitle">Dashboard</h1>
          <p id="viewSub">Live data from Supabase.</p>
        </div>
        <div class="btnline top-actions">
          <button id="columnSettingsBtn">Columns</button>
          <button id="refreshBtn">Refresh</button>
          <button id="exportBtn">Export</button>
          <details class="action-menu">
            <summary>Tools</summary>
            <div class="action-menu-panel">
              <button id="quickTourBtn">Quick overview</button>
              <button id="fullTourBtn">Full tutorial</button>
              <button id="moduleTrainingBtn">Detailed Module Training Guide</button>
              <button id="cloneExportBtn">Export Clone</button>
              <button id="offlineCloneBtn">Offline Clone</button>
              <button id="transactionResetBtn" class="danger" hidden>Recoverable Transaction Reset</button>
            </div>
          </details>
          <button id="changePasswordBtn">Change Password</button>
          <button id="logoutBtn">Logout</button>
        </div>
      </header>
      <button id="mobileChangePasswordBtn" class="mobile-change-password-btn" type="button" hidden>Change Password</button>
      <section id="loginPanel" class="login-panel">
        <div class="login-card">
          <h2>LMS Imports Login</h2>
          <p>Use the company user account assigned in User Master.</p>
          <input id="email" name="username" type="email" autocomplete="username" placeholder="Username or email">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password">
          <label class="remember-login"><input id="rememberLogin" type="checkbox" checked> Remember me on this device</label>
          <button id="loginBtn" class="primary">Log in</button>
          <div id="loginMsg" class="msg"></div>
        </div>
      </section>
      <section id="content" class="content"></section>
    </main>

    <div class="modalback" id="modal">
      <div class="modalbox">
        <div class="modalhead">
          <h2 id="modalTitle">Entry</h2>
          <button id="modalClose" class="rowbtn">x</button>
        </div>
        <div class="modalbody" id="modalBody"></div>
        <div class="modalfoot">
          <button id="modalDraft" type="button" class="modal-draft-btn" hidden>Save Draft</button>
          <button id="modalCancel">Cancel</button>
          <button id="modalSave" class="primary">Save</button>
        </div>
      </div>
    </div>

    <input id="fileImport" type="file" accept="application/json" hidden>
    <input id="assetFileImport" type="file" accept=".xlsx,.xls,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" hidden>
    <input id="assetLocationFileImport" type="file" accept=".xlsx,.xls,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" hidden>
    <input id="productFileImport" type="file" accept=".xlsx,.xls,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" hidden>
    <input id="productQtyCostFileImport" type="file" accept=".xlsx,.xls,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" hidden>
    <input id="vendorFileImport" type="file" accept=".xlsx,.xls,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" hidden>
    <input id="customerFileImport" type="file" accept=".xlsx,.xls,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" hidden>
    <input id="trialBalanceFileImport" type="file" accept=".xlsx,.xls,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" hidden>
    <input id="beginningInventoryFileImport" type="file" accept=".xlsx,.xls,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" hidden>
    <input id="beginningApFileImport" type="file" accept=".xlsx,.xls,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" hidden>
    <input id="beginningArFileImport" type="file" accept=".xlsx,.xls,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" hidden>
  <script type="module" src="./app.js?v=20260813-bank-reconciliation-report-1"></script>
  <script src="mechanic-current-work-tab.js"></script>
</body>
</html>
